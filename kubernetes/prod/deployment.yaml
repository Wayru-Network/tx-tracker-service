apiVersion: apps/v1
kind: Deployment
metadata:
  name: explorer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: explorer-service
  template:
    metadata:
      labels:
        app: explorer-service
    spec:
      containers:
        - name: explorer-service
          image: ${CONTAINER_REGISTRY}/explorer-server:${IMAGE_TAG}
          env:
            - name: DATABASE_HOST
              value: "57.151.72.86"
            - name: DATABASE_NAME
              value: dashboard_prod
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USERNAME
              value: TX_TRACKER_SERVICE
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "80"
            - name: SOLANA_API_URL
              value: https://mainnet.helius-rpc.com/
            - name: SOLANA_WALLET_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: explorer-server-secrets
                  key: SOLANA_WALLET_PRIVATE_KEY
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: explorer-server-secrets
                  key: DATABASE_PASSWORD
            - name: SOLANA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: explorer-server-secrets
                  key: SOLANA_API_KEY
            - name: EXPLORERS_DATABASE_HOST
              value: "wayru-prod-wifi.postgres.database.azure.com"
            - name: EXPLORERS_DATABASE_NAME
              value: explorers_db
            - name: EXPLORERS_DATABASE_PORT
              value: "5432"
            - name: EXPLORERS_DATABASE_USERNAME
              value: adminDB
            - name: EXPLORERS_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: explorer-server-secrets
                  key: EXPLORERS_DATABASE_PASSWORD
            - name: EXPLORERS_DATABASE_SSL
              value: "true"
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
